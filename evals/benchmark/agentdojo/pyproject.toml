# AgentDojo harness for Lazaret. The commit is pinned so a result can be reproduced and
# cited exactly: upstream 0.1.35, benchmark v1.2.2.
[project]
name = "lazaret-agentdojo"
version = "0.0.0"
description = "Runs the AgentDojo benchmark through the real Lazaret gateway."
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentdojo @ git+https://github.com/ethz-spylab/agentdojo@089ed468",
  # AgentDojo's AnthropicLLM constructs MessageParam, which SDK 2.x made a Union. Pinning
  # keeps the benchmark's code unmodified, which is what makes a result citable.
  "anthropic<1",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
